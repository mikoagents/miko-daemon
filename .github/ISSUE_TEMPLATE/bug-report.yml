name: Bug report
description: Report a Miko execution, provider, connection or lifecycle failure.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include Miko and Node versions, OS, provider and sanitized diagnostics. Omit credentials, prompts and private paths.
    validations:
      required: true
