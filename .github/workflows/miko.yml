name: Miko daemon
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:miko
      - run: npm run typecheck:miko
      - run: npm run test:miko
      - run: npm run pack:miko
      - run: node scripts/smoke-miko-install.mjs
