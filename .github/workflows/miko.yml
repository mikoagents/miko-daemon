name: Miko daemon
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: miko-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:miko
      - run: npm run typecheck:miko
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:miko
      - run: npm run test:core
      - run: npm run test:lifecycle
        if: runner.os != 'Windows'
      - run: npm exec --workspace=@getpaseo/client -- vitest run --maxWorkers=1
      - run: npm exec --workspace=@getpaseo/cli -- vitest run src --maxWorkers=1
      - run: npm run pack:miko
      - run: node scripts/smoke-miko-install.mjs
