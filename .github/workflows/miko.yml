name: Miko daemon
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:miko
      - run: npm run typecheck:miko
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:miko
      - run: npm run test:core
      - run: npm run test:lifecycle
        if: runner.os != 'Windows'
      - run: npm exec --workspace=@getpaseo/client -- vitest run --maxWorkers=1
      - run: npm exec --workspace=@getpaseo/cli -- vitest run src --maxWorkers=1
      - run: npm run pack:miko
      - run: node scripts/smoke-miko-install.mjs
